# pre-commit — 커밋 순간의 로컬 게이트 (위생 + 보안)
# 설치: pip install pre-commit && pre-commit install
#
# 보안·위생 훅은 스택 무관하게 그대로 둔다. 언어별 포맷터는 frontend(prettier)·backend(ruff)로 분리.

repos:
  # ── 위생 (범용) ──────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=500']   # 모델 파일(.litertlm)·PDF 샘플 커밋 차단
      - id: detect-private-key  # 개인키 커밋 차단

  # ── 비밀정보 스캔 (범용) ─────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ── .env 커밋 차단 (범용) ────────────────────────────────
  - repo: local
    hooks:
      - id: block-env-files
        name: Block .env files from being committed
        entry: env files should not be committed
        language: fail
        files: '^(\.env|\.env\.local|\.env\..+\.local)$'
      - id: block-model-files
        name: Block model binaries from being committed
        entry: model files belong in the host volume, not the repo
        language: fail
        files: '\.(litertlm|tflite|gguf|safetensors|bin)$'

  # ── backend: ruff (Python) ───────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
        files: '^backend/'
      - id: ruff-format
        files: '^backend/'

  # ── frontend: prettier (Vue/TS) ──────────────────────────
  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        entry: bash -c 'cd frontend && pnpm exec prettier --write "${@#frontend/}"' --
        language: system
        files: '^frontend/.*\.(vue|ts|js|json|css|md)$'
        exclude: '^frontend/(pnpm-lock\.yaml|dist/)'
