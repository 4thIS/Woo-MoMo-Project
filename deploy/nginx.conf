server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # SPA 진입점: 배포 후 브라우저가 옛 index.html을 재사용하지 않도록 항상 재검증
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 해시 파일명 에셋: 장기 캐시
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA 정적 파일
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # ES 모듈(.mjs, 예: /ort-wasm/*.jsep.mjs): 조건부 요청에 304를 주지 않고 항상 200 전체 응답.
    # 과거 application/octet-stream으로 캐시한 브라우저는 304를 받으면 옛 Content-Type을 재사용해
    # 모듈 로드가 계속 실패한다(PR #20 이후에도 재발). 200이면 캐시 항목의 헤더가 교체되어 자동 복구된다.
    # 파일이 작아(수십 KB) 매번 받아도 비용이 거의 없다. 정규식 location이라 위 location /보다 우선한다.
    location ~* \.mjs$ {
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 모델 파일: Range 허용, 장기 캐시, 압축 없음
    location /models/ {
        alias /usr/share/nginx/models/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Accept-Ranges bytes;
        gzip off;
        sendfile on;
        tcp_nopush on;
        autoindex off;
        access_log off;
        limit_conn models 2;
        limit_rate_after 50m;
        limit_rate 20m;
    }

    # FastAPI 프록시 (/api/... 경로 그대로 전달)
    # 컨테이너 재시작 시 api의 DNS가 바뀔 수 있어 요청마다 재해석한다.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api;
        proxy_pass http://$api_upstream:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
