# http 레벨 설정. conf.d/*.conf는 nginx:alpine 기본 이미지에서 http {} 블록에 포함된다.
# 파일명(00- 접두사)으로 default.conf(서버 블록)보다 먼저 로드되게 한다.
limit_conn_zone $binary_remote_addr zone=models:10m;

# nginx 기본 mime.types에는 .mjs가 없어 application/octet-stream으로 나간다.
# 브라우저는 모듈 스크립트(dynamic import)에 JS MIME을 요구하므로 추가한다(onnxruntime-web ort-wasm/*.mjs).
# http 레벨 types 블록은 기본 mime.types에 덧붙는다.
types {
    text/javascript mjs;
}
