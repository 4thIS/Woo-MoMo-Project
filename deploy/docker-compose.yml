# 이미지 태그: 운영(main)=latest, demomo(dev)=deploy/.env의 IMAGE_TAG=dev. CI가 브랜치마다 GHCR에 올린다.
# 파이는 `docker compose pull && docker compose up -d`로 받기만 한다(build:는 로컬 빌드용으로 남겨 둔다).
services:
  web:
    image: ghcr.io/4this/woo-momo-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    ports:
      - "${WEB_BIND:-127.0.0.1:8080}:80"
    volumes:
      - /srv/momo/models:/usr/share/nginx/models:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: ghcr.io/4this/woo-momo-api:${IMAGE_TAG:-latest}
    build:
      context: ../backend
      dockerfile: ../deploy/api.Dockerfile
    expose:
      - "8000"
    environment:
      DATA_DIR: /data
      CORS_ORIGINS: ${CORS_ORIGINS:-https://momo.ssenu.cloud,https://demomo.ssenu.cloud,http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      BEN_DAILY_LIMIT: ${BEN_DAILY_LIMIT:-30}
      BAZE_API_KEYS: ${BAZE_API_KEYS:-}
      BAZE_VOICE_MODEL: ${BAZE_VOICE_MODEL:-gemini-3.8-flash}
      BAZE_MIN_REMAINING: ${BAZE_MIN_REMAINING:-50}
      BEN_REPORT_V2: ${BEN_REPORT_V2:-false}
    volumes:
      # 계정 DB·녹음. 운영 /srv/momo/data, demomo는 deploy/.env의 DATA_HOST_DIR=/srv/momo-dev/data
      - ${DATA_HOST_DIR:-/srv/momo/data}:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
